<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dosik Barbosik</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<!-- ГОЛОВНИЙ ЕКРАН -->
<!-- ГОЛОВНИЙ ЕКРАН -->
<header class="hero" id="hero">

  <!-- Кульки (сховані під столом, вилітають при святі) -->
  <img class="balloon b1" src="./images/balloon1.png" alt="">
  <img class="balloon b2" src="./images/balloon2.png" alt="">
  <img class="balloon b3" src="./images/balloon3.png" alt="">

  <div class="hero-content">
    <!-- Песик зліва -->
    <div class="dog-box">
      <img class="dog" src="./images/dog.png" alt="Песик">
      <img class="hat" src="./images/hat.png" alt="Шапочка">
    </div>

    <!-- Текст справа -->
    <div class="hero-text">
      <p class="small-title">Сьогодні особливий день</p>
      <h1>Donatello</h1>
      <p class="subtitle" id="heroAge">Мені сьогодні 1 рік!</p>
      <button id="partyBtn">Привітати 🎉</button>
    </div>
  </div>

  <!-- Стіл -->
  <div class="table"></div>

  <!-- Торт падає на стіл -->
  <img class="cake" src="./images/cake.png" alt="Торт">
</header>

<!-- ЛІЧИЛЬНИК -->
<section class="counter-section">
  <h2 id="counterTitle">Мені вже</h2>

  <div class="cards">
    <div class="card">
      <span class="number" id="years">0</span>
      <span class="label" id="yearsLabel">років</span>
    </div>
    <div class="card">
      <span class="number" id="months">0</span>
      <span class="label" id="monthsLabel">місяців</span>
    </div>
    <div class="card">
      <span class="number" id="days">0</span>
      <span class="label" id="daysLabel">днів</span>
    </div>
  </div>

  <p id="message"></p>
</section>


<!-- ЛАПКИ-РОЗДІЛЬНИК -->
<section class="paws-band">
  <p>Донні пес-крутишка (як і мамка його)</p>
</section>

<!-- СТІКЕРПАКИ -->
<section class="stickers-section">
  <h2>Мої стікерпаки 💬</h2>
  <p class="stickers-sub">Додавайте у Телеграм!</p>

  <div class="sticker-cards">

    <a class="sticker-card" href="https://t.me/addstickers/Dlnatelka" target="_blank">
      <img src="./images/stickers1.png" alt="Стікерпак 1">
      <h3>Перший набір</h3>
      <span class="sticker-btn">Додати в Телеграм</span>
    </a>

    <a class="sticker-card" href="https://t.me/addstickers/SHlyapy75" target="_blank">
      <img src="./images/stickers2.png" alt="Стікерпак 2">
      <h3>Другий набір</h3>
      <span class="sticker-btn">Додати в Телеграм</span>
    </a>

  </div>
</section>

<!-- ГАЛЕРЕЯ -->
<section class="gallery-section">
  <h2>Мої фотошкі</h2>
  <div class="gallery">
    <img src="./images/photo1.jpg" alt="Фото 1">
    <img src="./images/photo2.jpg" alt="Фото 2">
    <img src="./images/photo3.jpg" alt="Фото 3">

    <img src="./images/photo4.jpg" alt="Фото 4">
    <img src="./images/photo5.jpg" alt="Фото 5">
    <img src="./images/photo6.jpg" alt="Фото 6">

    <img src="./images/photo7.jpg" alt="Фото 7">
    <img src="./images/photo8.jpg" alt="Фото 8">
    <img src="./images/photo9.jpg" alt="Фото 9">
  </div>
</section>

<footer>
  <a href="https://www.instagram.com/donatello_iggy/" target="_blank">Donatello's Instagram</a>
</footer>



</body>
</html>
